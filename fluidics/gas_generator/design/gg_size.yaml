# YAML File defining the high level gas-generator sizing elements:

gas_generator:

  chamber:
    
    p_cc: 25.0e5          # Chamber Pressure [ Pa ]
    MR: 1.0               # Design Mixture Ratio [ N.D. ]
    m_dot_t: 112.0e-3     # Total mass-flow rate from the gas-generator [ kg/s ]

  injector:

    fuel:
      
      name: "IPA"                   # User specified name of the Fuel
      m_factor: 1.0                 # Percentage of total fuel mass flow rate [ N.D. ]
      p_inlet: 50.0e5               # Injector Inlet pressure [ Pa ]
      cd: 0.6                       # Injector Discharge Coefficient [ N.D. ]
      type: "orifice"               # Method to call-out the geometry type of this injector
      N: 4                          # Number of fuel injector holes
      inj_model: "ideal_liquid"   # Ideal Incompressible Liquid is used for injection modelling

      fluid_model: "user_defined"   # We will manually define the relevant fluid parameters
      params:
        rho: 786                    # Inlet Density of the IPA [ kg/m^3 ]

    oxidiser:

      name: "Nitrous Oxide"         # User specified name of the oxidiser
      m_factor: 1.0                 # Percentage of total oxidiser mass flow rate [ N.D. ]
      p_inlet: 50.0e5               # Injector Inlet Pressure [ Pa ]
      cd: 0.3                       # Injector Discharger Coefficient [ N.D. ]
      type: "orifice"               # Method to call-out the geometry type of this injector
      N: 1                          # Number of oxidiser injector holes.
      inj_model: "ideal_liquid"     # Ideal Incompressible Liquid is used for injection modelling

      fluid_model: "coolprop"       # We will derive the fluid properties via `coolprop`
      parmas:
        t_inlet: 273.15             # Inlet Temperature of the Nitrous [ K ]

      
